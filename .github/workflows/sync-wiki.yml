name: Sync wiki

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch: {}

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.WIKI_SYNC_TOKEN }}

      - name: Mirror markdown into wiki
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.obsidian/' \
            --exclude='wiki/' \
            --include='*/' \
            --include='*.md' \
            --exclude='*' \
            ./ ./wiki/
          if [ -f wiki/README.md ]; then
            mv -f wiki/README.md wiki/Home.md
          fi

      - name: Commit and push
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync wiki from ${{ github.sha }}"
            git push origin HEAD:master
          fi
